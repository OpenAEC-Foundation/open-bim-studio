[package]
name = "ocs_driver"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway spike code (see ../../README.md). It measures `cadkernel`, the
# MPL-2.0 B-rep kernel Open CAD Studio runs on, against the boolean torture set
# (R-16) and the precision set (R-17). Nothing here is a design proposal.

[[bin]]
name = "ocs_driver"
path = "src/main.rs"

[dependencies]
# Pinned by commit, not by version: the crate is unpublished.
cadkernel = { git = "https://github.com/HakanSeven12/cadkernel", rev = "953d546b68aef4b6692566a1a9b077fc5bd9fb4f", default-features = false, features = ["brep"] }
serde_json = "1"

[profile.release]
debug = false
