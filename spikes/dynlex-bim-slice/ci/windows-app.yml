# Windows build and package of Open BIM Studio: the DynLex compiler from the
# v0.1 source snapshot (as windows-compiler.yml), then the BIM slice from
# this repository's overlay (the Windows port: `platform/obs_platform.c`,
# the dialogs, the package script), headless checks, and the portable ZIP
# and the MSI as artifacts. Nothing is published or signed.
#
# Kept here, not in .github/workflows, while the repository's rule keeps
# build tooling under spikes/; GitHub runs it once it is copied to
# .github/workflows/windows-app.yml on the branch below.
name: Windows app (v0.1)

on:
  push:
    branches: [codex/windows-v0.1]
  workflow_dispatch:

permissions:
  # A draft release's assets may need `contents: write` to be listed; the
  # download step says so when it cannot find the asset.
  contents: read

jobs:
  app:
    runs-on: windows-latest
    # The pinned LLVM fork is built from source on the first run.
    timeout-minutes: 360
    defaults:
      run:
        working-directory: dynlex
    steps:
      - uses: actions/checkout@v7
        with:
          path: open-bim-studio

      - name: Download the v0.1 source snapshot
        working-directory: .
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1 --repo "${{ github.repository }}" `
            --pattern "Open-BIM-Studio-0.1-source.tar.gz" --dir snapshot
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the v0.1 source asset; a draft release may need contents: write."
          }
          New-Item -ItemType Directory -Force dynlex | Out-Null
          tar -xzf snapshot/Open-BIM-Studio-0.1-source.tar.gz -C dynlex
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack the source snapshot." }
          if (-not (Test-Path dynlex/scripts/install.ps1)) {
            throw "The snapshot has no scripts/install.ps1 at its root."
          }

      - name: Apply the slice's compiler patches (unless already in)
        shell: pwsh
        run: |
          $patches = "../open-bim-studio/spikes/dynlex-bim-slice/patches"
          foreach ($name in "dynlex-compiler-local", "dynlex-shader-extensions", "dynlex-windows-library-names") {
            git apply -p1 --whitespace=nowarn --check -R "$patches/$name.patch" 2>$null
            if ($LASTEXITCODE -eq 0) { Write-Host "$name is already in the snapshot"; continue }
            git apply -p1 --whitespace=nowarn "$patches/$name.patch"
            if ($LASTEXITCODE -ne 0) { throw "Patch $name does not apply to the snapshot." }
            Write-Host "applied $name"
          }

      - name: Restore the pinned toolchains
        uses: actions/cache@v6
        with:
          path: |
            dynlex/.cache/llvm-toolchain
            dynlex/.cache/llvm-mingw
            dynlex/.cache/vcpkg
            dynlex/.cache/vcpkg-installed
          key: obs-windows-toolchains-${{ runner.arch }}-${{ hashFiles('dynlex/metadata/LLVM_TOOLCHAIN', 'dynlex/metadata/LLVM_MINGW_TOOLCHAIN', 'dynlex/metadata/VCPKG_TOOLCHAIN', 'dynlex/vcpkg.json', 'dynlex/cmake/vcpkg-triplets/*.cmake', 'dynlex/scripts/llvm_toolchain.sh', 'dynlex/scripts/llvm-mingw-toolchain.ps1') }}

      - name: Install dependencies
        shell: pwsh
        run: ./scripts/install.ps1

      - name: Build the compiler (Release)
        shell: bash
        run: ./scripts/build.sh --release

      - name: Assemble the slice from this repository
        shell: pwsh
        # As build.sh does on Linux: the overlay over the tree, the prebuilt
        # shaders, the review models for the fixture tests.
        run: |
          $spike = (Resolve-Path "../open-bim-studio/spikes/dynlex-bim-slice").Path
          # robocopy merges into the tree's folders; below 8 it succeeded.
          robocopy "$spike/overlay" . /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Could not copy the overlay." }
          robocopy "$spike/shaders" build/shaders *.spv /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Could not copy the shaders." }
          robocopy "$spike/examples" examples/bim-slice/models /E /NFL /NDL /NJH /NJS | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Could not copy the review models." }
          $global:LASTEXITCODE = 0
          if (-not (Select-String -Quiet -Path lib/json.dl -Pattern "the JSON document parsed from")) {
            git apply -p1 "$spike/patches/lib-json-public-parse.patch"
            if ($LASTEXITCODE -ne 0) { throw "The JSON patch does not apply." }
          }

      - name: Build the platform shim
        shell: pwsh
        # The static library the slice links as "obs_platform", where the
        # compiler's Windows link looks for libraries.
        run: |
          $tools = Join-Path $env:DYNLEX_WINDOWS_TOOLCHAIN_ROOT "bin"
          & (Join-Path $tools "cc.exe") "--target=$env:DYNLEX_WINDOWS_TOOLCHAIN_TARGET" -std=c11 -O2 -Wall -Wextra `
            -c examples/bim-slice/platform/obs_platform.c -o build/obs_platform.o
          if ($LASTEXITCODE -ne 0) { throw "The platform shim does not compile." }
          & (Join-Path $tools "llvm-ar.exe") rcs build/libobs_platform.a build/obs_platform.o
          if ($LASTEXITCODE -ne 0) { throw "Could not archive the platform shim." }
          Copy-Item -Force build/libobs_platform.a (Join-Path $env:DYNLEX_WINDOWS_DEPENDENCY_ROOT "lib")

      - name: Headless checks of the slice
        shell: pwsh
        # platform: the shim itself; ui_layout: no library; plan_pan: GLFW
        # and the Vulkan loader linked; text_glyphs: FreeType too. None opens
        # a window.
        run: |
          $failed = @()
          foreach ($name in "platform", "ui_layout", "plan_pan", "text_glyphs") {
            $program = "build/check-$name.exe"
            & build/dynlex.exe "examples/bim-slice/tests/$name.dl" -o $program
            if ($LASTEXITCODE -ne 0) { $failed += "$name (compile)"; continue }
            $output = (& $program | Out-String) -replace "`r`n", "`n"
            $exitCode = $LASTEXITCODE
            $expected = (Get-Content -Raw "examples/bim-slice/tests/$name.expected.txt") -replace "`r`n", "`n"
            if (($exitCode -ne 0) -or ($output.TrimEnd() -ne $expected.TrimEnd())) {
              Write-Host "--- $name (exit $exitCode)"; Write-Host $output
              $failed += $name
            } else {
              Write-Host "PASS $name"
            }
          }
          if ($failed.Count -gt 0) { throw "Failed: $($failed -join ', ')" }

      - name: Build Open BIM Studio
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/app | Out-Null
          & build/dynlex.exe examples/bim-slice/main.dl -O2 -o build/app/open-bim-studio.exe
          if ($LASTEXITCODE -ne 0) { throw "Open BIM Studio does not compile." }
          Get-ChildItem build/app | Format-Table Name, Length

      - name: Install the WiX Toolset 3
        shell: pwsh
        run: |
          choco install wixtoolset -y --no-progress
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixBin = Join-Path ${env:ProgramFiles(x86)} "WiX Toolset v3.14\bin"
            if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
              $wixBin = (Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1).FullName + "\bin"
            }
            if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) { throw "WiX was installed but candle.exe could not be found." }
            Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          }

      - name: Package
        shell: pwsh
        run: |
          ./examples/bim-slice/installer/make-windows-package.ps1 `
            -Program build/app/open-bim-studio.exe -Tree . -Output build/package -Version 0.1.0 `
            -DependencyRoot $env:DYNLEX_WINDOWS_DEPENDENCY_ROOT -ToolchainRoot $env:DYNLEX_WINDOWS_TOOLCHAIN_ROOT
          if (-not (Test-Path build/package/Open-BIM-Studio-0.1.0-windows-x64.msi)) { throw "No MSI was made." }

      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: open-bim-studio-windows-x64-0.1.0
          path: |
            dynlex/build/package/*.zip
            dynlex/build/package/*.msi
          if-no-files-found: error
